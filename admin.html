<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - MACOBO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="isotipo-macobo.ico" type="image/png">
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-slate-900 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">Panel de Administración (ABM)</h1>
            <a href="index.html" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-slate-200 transition">Ver Catálogo Público</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Columna Izquierda: Formularios (Alta y Edición) -->
        <div class="space-y-6">
            
            <!-- Formulario de Alta -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-bold mb-4 text-slate-700 border-b pb-2">Nuevo Producto</h2>
                <form id="form-producto" onsubmit="agregarProducto(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Nombre del Producto</label>
                        <input type="text" id="nombre" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-slate-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Categoría</label>
                        <select id="categoria" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-slate-500 focus:outline-none bg-white">
                            <option value="">Seleccioná una categoría</option>
                            <option value="Pastas">Pastas</option>
                            <option value="Conservas y Encurtidos">Conservas y Encurtidos</option>
                            <option value="Panificación">Panificación</option>
                            <option value="Gastronomía">Gastronomía</option>
                            <option value="Quesos">Quesos</option>
                            <option value="Fiambres">Fiambres</option>
                            <option value="Dulces y Repostería">Dulces y Repostería</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Descripción</label>
                        <textarea id="descripcion" rows="3" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-slate-500 focus:outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">URL de la Imagen (Drive)</label>
                        <input type="url" id="imagen" placeholder="Pegá el link de Google Drive..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-slate-500 focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-lg transition">Dar de Alta</button>
                </form>
            </div>

            <!-- Formulario de Modificación -->
            <div id="seccion-editar" class="bg-amber-50 p-6 rounded-xl shadow-sm border border-amber-200 hidden">
                <h2 class="text-lg font-bold mb-4 text-amber-800 border-b border-amber-200 pb-2">Modificar Producto</h2>
                <form id="form-editar" onsubmit="actualizarProducto(event)" class="space-y-4">
                    <input type="hidden" id="edit-id">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-700 mb-1">Nombre del Producto</label>
                        <input type="text" id="edit-nombre" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-700 mb-1">Categoría</label>
                        <select id="edit-categoria" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                            <option value="Pastas">Pastas</option>
                            <option value="Fiambrería">Fiambrería</option>
                            <option value="Lácteos">Lácteos</option>
                            <option value="Insumos">Insumos</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-700 mb-1">Descripción</label>
                        <textarea id="edit-descripcion" rows="3" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-700 mb-1">URL de la Imagen (Drive)</label>
                        <input type="url" id="edit-imagen" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-lg transition">Guardar Cambios</button>
                        <button type="button" onclick="document.getElementById('seccion-editar').classList.add('hidden')" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-3 py-2 rounded-lg text-xs font-semibold">Cancelar</button>
                    </div>
                </form>
            </div>

        </div>

        <!-- Columna Derecha: Tabla de Gestión con Buscador y Categorías -->
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 pb-2 border-b gap-4">
                <h2 class="text-lg font-bold text-slate-700">Productos Existentes</h2>
                <!-- Buscador en el Admin -->
                <input type="text" id="buscador-admin" placeholder="Buscar en el panel..." class="w-full sm:w-64 px-3 py-1.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-500">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-gray-50 text-xs text-gray-500 uppercase">
                            <th class="p-3">Imagen</th>
                            <th class="p-3">Nombre</th>
                            <th class="p-3">Categoría</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-admin-body">
                        <!-- Se llena con JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script type="module" src="app.js"></script>
    <script>
        let cacheProductosAdmin = [];

        window.cargarTablaAdmin = async function(productosAMostrar = null) {
            const tbody = document.getElementById('tabla-admin-body');

            try {
                if (!productosAMostrar) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-gray-400 py-6">Cargando productos...</td></tr>`;
                    cacheProductosAdmin = await window.obtenerProductos();
                }

                const productos = [...(productosAMostrar || cacheProductosAdmin)];
                tbody.innerHTML = '';

                if (productos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-gray-400 py-6">No hay productos cargados.</td></tr>`;
                    return;
                }

                productos.sort((a, b) => a.categoria.localeCompare(b.categoria));

                let categoriaActual = '';

                productos.forEach(p => {
                    if (p.categoria !== categoriaActual) {
                        categoriaActual = p.categoria;
                        tbody.innerHTML += `
                            <tr class="bg-slate-100 font-bold text-xs text-slate-600 uppercase">
                                <td colspan="4" class="p-2 px-3 tracking-wider">${categoriaActual}</td>
                            </tr>
                        `;
                    }

                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-3">
                                <img src="${p.imagen || 'https://via.placeholder.com/100?text=Sin+Img'}" class="w-12 h-12 object-cover rounded">
                            </td>
                            <td class="p-3 font-medium text-slate-800">${p.nombre}</td>
                            <td class="p-3 text-sm text-gray-600">
                                <span class="bg-slate-100 text-slate-700 px-2 py-1 rounded text-xs font-semibold">${p.categoria}</span>
                            </td>
                            <td class="p-3 text-center space-x-2">
                                <button onclick="prepararEdicion('${p.id}')" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-3 py-1.5 rounded text-xs font-semibold transition">Modificar</button>
                                <button onclick="eliminarProducto('${p.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded text-xs font-semibold transition">Eliminar</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-red-500 py-6">Error al conectar con Firebase: ${error.message}</td></tr>`;
            }
        };

        document.getElementById('buscador-admin').addEventListener('input', (e) => {
            const texto = e.target.value.toLowerCase();
            const filtrados = cacheProductosAdmin.filter(p => 
                p.nombre.toLowerCase().includes(texto) || 
                p.categoria.toLowerCase().includes(texto)
            );
            window.cargarTablaAdmin(filtrados);
        });
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
