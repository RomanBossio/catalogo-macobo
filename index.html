<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - MACOBO Distribuciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="isotipo-macobo.ico" type="image/png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        macoboWhite: '#FFF',    
                        macoboBlue: '#0000CD',    
                        macoboOrange: '#FF6B00'   /* Naranja energético de la flecha */
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800">

<!-- Encabezado fijo con fondo blanco sólido y doble línea inferior -->
<header class="bg-white text-gray-800 py-5 shadow-md sticky top-0 z-50 relative pb-7">
    <div class="container mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        
        <!-- Contenedor del Logo -->
        <div class="flex items-center">
            <img src="logo-macobo.png" alt="MACOBO Distribuciones" class="h-16 md:h-20 w-auto object-contain">
        </div>

        <!-- Etiqueta informativa más grande y con texto negro/oscuro -->
        <div class="text-sm md:text-base bg-gray-100 px-5 py-2.5 rounded-full text-slate-900 font-bold border border-gray-200 tracking-wide shadow-sm">
            CATÁLOGO MAYORISTA DE PRODUCTOS
        </div>
    </div>

    <!-- Líneas inferiores: Azul arriba y Naranja abajo -->
    <div class="absolute bottom-0 left-0 right-0 flex flex-col">
        <div class="h-1.5 bg-macoboBlue w-full"></div>
        <div class="h-1.5 bg-macoboOrange w-full"></div>
    </div>
</header>

    <!-- Contenido Principal -->
    <main class="container mx-auto px-4 py-8">
        <div class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <h2 class="text-xl font-bold text-slate-700 border-l-4 border-macoboOrange pl-3">Nuestros Productos</h2>
            <!-- Buscador rápido -->
            <input type="text" id="buscador" placeholder="Buscar producto o categoría..." class="w-full md:w-80 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-macoboOrange bg-white shadow-sm">
        </div>

        <!-- Contenedor separado por categorías -->
        <div id="contenedor-categorias" class="space-y-10">
            <!-- Se llena dinámicamente -->
        </div>
    </main>

    <script type="module" src="app.js"></script>
    <script>
        let cacheProductos = [];

        window.mostrarCatalogo = async function(productosAMostrar = null) {
            const contenedor = document.getElementById('contenedor-categorias');
            
            try {
                if (!productosAMostrar) {
                    contenedor.innerHTML = `<p class="text-center text-gray-500 py-10">Cargando catálogo...</p>`;
                    cacheProductos = await window.obtenerProductos();
                }

                const productos = productosAMostrar || cacheProductos;
                contenedor.innerHTML = '';

                if (productos.length === 0) {
                    contenedor.innerHTML = `<p class="text-center text-gray-500 py-10 bg-white rounded-xl shadow-sm border border-gray-100">No hay productos cargados todavía.</p>`;
                    return;
                }

                const categoriasMap = {};
                productos.forEach(p => {
                    const cat = p.categoria || 'Sin Categoría';
                    if (!categoriasMap[cat]) {
                        categoriasMap[cat] = [];
                    }
                    categoriasMap[cat].push(p);
                });

                for (const [categoria, listaProductos] of Object.entries(categoriasMap)) {
                    let htmlTarjetas = '';

                    listaProductos.forEach(p => {
                        htmlTarjetas += `
                            <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden border border-gray-100 flex flex-col">
                                <div class="w-full aspect-[4/3] bg-gray-100 overflow-hidden">
                                    <img src="${p.imagen || 'https://via.placeholder.com/300?text=Sin+Imagen'}" alt="${p.nombre}" class="w-full h-full object-cover">
                                </div>
                                <div class="p-4 flex flex-col flex-grow">
                                    <h3 class="font-bold text-lg text-slate-800 mb-1">${p.nombre}</h3>
                                    <p class="text-sm text-gray-600 flex-grow">${p.descripcion || 'Sin descripción disponible.'}</p>
                                </div>
                            </div>
                        `;
                    });

                    contenedor.innerHTML += `
                        <section class="space-y-4">
                            <div class="border-b-2 border-slate-200 pb-2 flex items-center justify-between">
                                <h3 class="text-xl font-bold text-slate-800 uppercase tracking-wide flex items-center gap-2">
                                    <span class="w-3 h-3 bg-macoboOrange rounded-full inline-block"></span>
                                    ${categoria}
                                </h3>
                                <span class="text-xs font-semibold text-slate-600 bg-slate-200 px-2.5 py-1 rounded-full">${listaProductos.length} productos</span>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                                ${htmlTarjetas}
                            </div>
                        </section>
                    `;
                }
            } catch (error) {
                console.error(error);
                contenedor.innerHTML = `<p class="text-center text-red-500 py-10">Error al cargar el catálogo: ${error.message}</p>`;
            }
        };

        document.getElementById('buscador').addEventListener('input', (e) => {
            const texto = e.target.value.toLowerCase();
            const filtrados = cacheProductos.filter(p => 
                p.nombre.toLowerCase().includes(texto) || 
                p.categoria.toLowerCase().includes(texto)
            );
            window.mostrarCatalogo(filtrados);
        });
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
